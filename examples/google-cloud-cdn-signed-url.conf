# Include in a dedicated server {}.
# Requires ngx_var_module for base64url_decode.
# Replace example-key, the Base64URL key, and the document root.

location / {
    if ($request_method !~ "^(GET|HEAD)$") {
        return 403;
    }

    if ($request_uri !~ "^(?<gcdn_url_data>/[^?]*[?](?:(?<gcdn_url_query>.*)&)?Expires=(?<gcdn_url_expires>[0-9]+)&KeyName=example-key)&Signature=(?<gcdn_url_signature>[A-Za-z0-9_-]{27}=?)$") {
        return 403;
    }

    if ($gcdn_url_query ~ "(^|&)(Expires|KeyName|Signature|URLPrefix)=") {
        return 403;
    }

    var $gcdn_url_key base64url_decode REPLACE_WITH_YOUR_BASE64URL_KEY;

    secure_link_hmac on;
    secure_link_hmac_algorithm sha1;
    secure_link_hmac_secret $gcdn_url_key;
    secure_link_hmac_message "$scheme://$host$gcdn_url_data";
    secure_link_hmac_check_token $gcdn_url_signature digest=base64url;
    secure_link_hmac_check_time $gcdn_url_expires range_end=0 format=%s;

    if ($secure_link_hmac != 1) {
        return 403;
    }

    root /srv/files;
}

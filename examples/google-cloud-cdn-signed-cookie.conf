# Include in a dedicated server {}.
# Requires ngx_var_module for base64url_decode, unescape_uri, len and substr.
# Replace example-key, the Base64URL key, and the document root.

location / {
    if ($request_method !~ "^(GET|HEAD)$") {
        return 403;
    }

    if ($args ~ "(^|&)(Expires|KeyName|Signature|URLPrefix)=") {
        return 403;
    }

    if ($http_cookie ~ "(^|;[[:blank:]]*)Cloud-CDN-Cookie=[^;]*;[[:blank:]]*([^;]*;[[:blank:]]*)*Cloud-CDN-Cookie=") {
        return 403;
    }

    if ($http_cookie !~ "(?:^|;[[:blank:]]*)Cloud-CDN-Cookie=(?<gcdn_cookie_policy>URLPrefix=(?<gcdn_cookie_prefix_encoded>[A-Za-z0-9_-]+={0,2}):Expires=(?<gcdn_cookie_expires>[0-9]+):KeyName=example-key):Signature=(?<gcdn_cookie_signature>[A-Za-z0-9_-]{27}=?)[[:blank:]]*(?:;|$)") {
        return 403;
    }

    var $gcdn_cookie_key base64url_decode REPLACE_WITH_YOUR_BASE64URL_KEY;

    secure_link_hmac on;
    secure_link_hmac_algorithm sha1;
    secure_link_hmac_secret $gcdn_cookie_key;
    secure_link_hmac_message $gcdn_cookie_policy;
    secure_link_hmac_check_token $gcdn_cookie_signature digest=base64url;
    secure_link_hmac_check_time $gcdn_cookie_expires range_end=0 format=%s;

    if ($secure_link_hmac != 1) {
        return 403;
    }

    var $gcdn_cookie_prefix base64url_decode $gcdn_cookie_prefix_encoded;

    if ($gcdn_cookie_prefix !~ "^https?://[^/?#]+/[^?#]*$") {
        return 403;
    }

    var $gcdn_cookie_prefix_length len $gcdn_cookie_prefix;
    var $gcdn_cookie_request_prefix substr "$scheme://$host$request_uri" 0 $gcdn_cookie_prefix_length;

    if ($gcdn_cookie_request_prefix != $gcdn_cookie_prefix) {
        return 403;
    }

    var $gcdn_cookie_decoded_prefix unescape_uri $gcdn_cookie_prefix;
    var $gcdn_cookie_decoded_length len $gcdn_cookie_decoded_prefix;
    var $gcdn_cookie_resource_prefix substr "$scheme://$host$uri" 0 $gcdn_cookie_decoded_length;

    if ($gcdn_cookie_resource_prefix != $gcdn_cookie_decoded_prefix) {
        return 403;
    }

    root /srv/files;
}

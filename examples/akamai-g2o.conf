# Include in server {}.
# Replace edge01 and the shared secret with the values configured at Akamai.

location /download/ {
    set $g2o_timestamp "";
    if ($http_x_akamai_g2o_auth_data ~ "^5,\s+[^,\s]+,\s+[^,\s]+,\s+([^,\s]+),\s+[^,\s]+,\s+edge01$") {
        set $g2o_timestamp $1;
    }

    secure_link_hmac on;
    secure_link_hmac_algorithm sha256;
    secure_link_hmac_secret "REPLACE_WITH_YOUR_SHARED_SECRET";
    secure_link_hmac_message "$http_x_akamai_g2o_auth_data$request_uri";
    secure_link_hmac_check_token $http_x_akamai_g2o_auth_sign digest=base64;
    secure_link_hmac_check_time $g2o_timestamp range_start=-30 range_end=30 format=%s;

    if ($secure_link_hmac != 1) {
        return 403;
    }

    root /srv/g2o;
}

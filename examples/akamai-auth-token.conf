# Include in server {}.
# Requires ngx_var_module for hex_decode, extract_param and sub.
# Replace the hexadecimal key and set the document root or content handler.

location ^~ /protected/ {
    set $akamai_token_data "";
    set $akamai_token_hmac "";

    if ($http_x_auth_token ~ "^(st=[0-9]+~exp=[0-9]+~acl=/protected/[*])~hmac=([0-9a-fA-F]{64})$") {
        set $akamai_token_data $1;
        set $akamai_token_hmac $2;
    }

    if ($akamai_token_data = "") {
        return 403;
    }

    var $akamai_token_key hex_decode REPLACE_WITH_YOUR_HEX_KEY;
    var $akamai_token_start extract_param $akamai_token_data ~ = st;
    var $akamai_token_end extract_param $akamai_token_data ~ = exp;
    var $akamai_token_lifetime sub $akamai_token_end $akamai_token_start;

    secure_link_hmac on;
    secure_link_hmac_algorithm sha256;
    secure_link_hmac_secret $akamai_token_key;
    secure_link_hmac_message $akamai_token_data;
    secure_link_hmac_check_token $akamai_token_hmac digest=hex;
    secure_link_hmac_check_time $akamai_token_start
        range_start=0 range_end=$akamai_token_lifetime format=%s;

    if ($secure_link_hmac != 1) {
        return 403;
    }

    root /srv/files;
}
